name: Validate Kit migration readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only Kit checks
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python validate_kit.py
