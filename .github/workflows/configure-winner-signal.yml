name: Configure Winner Signal branding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-buttondown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply and verify Buttondown overlap settings
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python configure_buttondown.py --apply
